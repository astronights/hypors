[package]
name = "hypors-py"
authors = ["Shubhankar Agrawal <shubhankar.a31@gmail.com>"]
version = "0.4.1"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/astronights/hypors"
description = "Python bindings for the hypors hypothesis testing crate"
publish = false

[lib]
name = "hypors"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
# The bindings are a thin translation layer: every statistic comes from the
# parent crate, so a fix there reaches Python without being reimplemented.
hypors = { path = ".." }
pyo3 = { version = "0.29", features = ["extension-module", "abi3-py38"] }
