name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Test and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      # Plain `cargo test` on purpose: it runs the unit, integration and
      # doc tests. `--all-targets` would silently drop the doc tests.
      - name: Tests
        run: cargo test

      # rust-cache's post-job cleanup walks target/ and errors on the
      # crate layout cargo package leaves behind, so clear it afterwards.
      - name: Package
        run: |
          cargo package
          rm -rf target/package

  python:
    name: Python bindings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # numpy and polars are not dependencies of the package; they are
      # installed so the tests can prove their arrays work by being iterable.
      - name: Tooling
        run: python -m pip install --upgrade pip maturin pytest numpy polars

      # The binding crate is not a workspace member, so the checks above do
      # not reach it.
      - name: Formatting
        run: cargo fmt --check --manifest-path python/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path python/Cargo.toml --all-targets -- -D warnings

      - name: Build and install the wheel
        working-directory: python
        run: |
          maturin build --interpreter python
          python -m pip install --force-reinstall target/wheels/*.whl
          rm -rf target/wheels

      - name: Tests
        run: python -m pytest python/tests -q
